# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "590c63b95c2f9d614101d3bd0ce4f071"
name = "Easy Migrate"
application_url = "https://easy-migrate.onrender.com"
embedded = true

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_files,read_metaobject_definitions,read_metaobjects,write_content,write_customers,write_files,write_metaobject_definitions,write_metaobjects,write_orders,write_products"

[auth]
redirect_urls = [ "https://easy-migrate.onrender.com/api/auth" ]
